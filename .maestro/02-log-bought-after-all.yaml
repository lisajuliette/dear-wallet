appId: com.pixelwitch.dearwallet
---
- launchApp:
    clearState: true
- runFlow: helpers/connect-dev-client.yaml
- runFlow: helpers/finish-onboarding.yaml
- setAirplaneMode: enabled
- tapOn:
    id: 'tab-log'
- extendedWaitUntil:
    visible:
      id: 'quick-log'
    timeout: 8000
- tapOn:
    id: 'pad-key-1'
- tapOn:
    id: 'pad-key-2'
- tapOn:
    id: 'quick-log-name'
- inputText: 'shoes'
- runFlow: helpers/dismiss-ios-keyboard-tip.yaml
- scrollUntilVisible:
    element:
      id: 'quick-log-save'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'quick-log-save'
- runFlow: helpers/close-reward-chain.yaml
- setAirplaneMode: disabled
- tapOn:
    id: 'tab-tally'
- tapOn: 'day'
- scrollUntilVisible:
    element:
      id: 'tally-item-shoes'
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 40
- tapOn:
    id: 'tally-item-shoes'
- tapOn:
    id: 'item-bought-after-all'
- assertVisible: 'undo, i didn.t buy it|undo'
- tapOn:
    id: 'item-undo-bought'
- assertVisible: 'i bought it after all'
