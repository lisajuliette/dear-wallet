appId: com.pixelwitch.dearwallet
---
- launchApp:
    clearState: true
- runFlow: helpers/connect-dev-client.yaml
- runFlow: helpers/finish-onboarding.yaml
- tapOn:
    id: 'home-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-palette-cloud'
    timeout: 8000
- tapOn:
    id: 'settings-palette-lilac'
# Swipe across the faceplate row (not mid-screen vertical ScrollView).
- repeat:
    times: 5
    commands:
      - swipe:
          start: 88%, 22%
          end: 12%, 22%
          duration: 350
- tapOn:
    id: 'settings-palette-midnight'
- assertVisible: '.*Midnight.*|.*try.*|.*unlock.*|.*locked.*|.*to go.*|FACEPLATES|at \\$1,000|try-on'
- tapOn:
    id: 'settings-back'
- extendedWaitUntil:
    visible:
      id: 'screen-home'
    timeout: 8000
- assertVisible:
    id: 'home-settings'
