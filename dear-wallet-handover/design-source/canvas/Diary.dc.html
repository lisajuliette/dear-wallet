<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="width: {{W}}px; height: {{H}}px; position: relative; overflow: hidden; box-sizing: border-box; font-family: Nunito, sans-serif; color: {{t.text}}; background-image: linear-gradient({{t.grid}} 1px, transparent 1px), linear-gradient(90deg, {{t.grid}} 1px, transparent 1px), linear-gradient(180deg, {{t.bg1}}, {{t.bg2}}); background-size: 22px 22px, 22px 22px, 100% 100%">
  <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" style="position: absolute; left: 136px; top: 64px"><path d="M12 1C12.9 7.6 16.4 11.1 23 12C16.4 12.9 12.9 16.4 12 23C11.1 16.4 7.6 12.9 1 12C7.6 11.1 11.1 7.6 12 1Z" fill="{{t.c1}}" stroke="{{t.outline}}" stroke-width="2"></path></svg>

  <header style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; align-items: center; gap: 8px">
    <h1 style="flex: 1; margin: 0; font-family: Pacifico, cursive; font-weight: 400; font-size: 32px; line-height: 1.3">Diary</h1>
    <span style="height: 36px; box-sizing: border-box; padding: 0 12px 0 8px; border-radius: 18px; border: 2px solid {{t.outline}}; background: {{t.surface}}; display: flex; align-items: center; gap: 5px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path d="M12 1C12.9 7.6 16.4 11.1 23 12C16.4 12.9 12.9 16.4 12 23C11.1 16.4 7.6 12.9 1 12C7.6 11.1 11.1 7.6 12 1Z" fill="{{t.c3}}" stroke="{{t.outline}}" stroke-width="2"></path></svg>
      <span style="font-family: 'Pixelify Sans', sans-serif; font-size: 16px; font-weight: 600">{{stars}}</span>
      <span style="font-size: 12px; font-weight: 800">stars</span>
    </span>
    <button type="button" aria-label="Diary lock settings" style="width: 44px; height: 44px; border-radius: 16px; border: 2px solid {{t.outline}}; background: {{t.surface}}; color: {{t.text}}; box-shadow: 0 3px 0 {{t.shadow}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3.5 6.5h7v6h-7z" fill="{{t.c2}}"></path><path d="M5 6.5V4.5a2 2 0 0 1 4 0v2"></path></svg></button>
  </header>

  <div style="position: absolute; left: 16px; right: 16px; top: 112px; bottom: 88px; overflow-y: auto; padding-bottom: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <div style="position: relative; height: 86px">
      <svg aria-hidden="true" width="{{cw}}" height="90" viewBox="0 0 {{cw}} 90" style="position: absolute; left: 0; top: 0; overflow: visible"><path d="{{promptPath}}" fill="{{t.shadow}}" transform="translate(0 4)"></path><path d="{{promptPath}}" fill="{{t.c2}}" stroke="{{t.outline}}" stroke-width="2"></path></svg>
      <div style="position: absolute; left: 16px; right: 12px; top: 24px; bottom: 8px; display: flex; align-items: center; gap: 10px">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-family: 'Pixelify Sans', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em">TODAY’S PROMPT</span>
          <span style="font-size: 16px; font-weight: 900; line-height: 1.3">how’s ur wallet feeling today?</span>
        </div>
        <a href="DiaryEntry_New.dc.html" style="height: 44px; padding: 0 18px; flex: none; box-sizing: border-box; border-radius: 22px; border: 2px solid {{t.outline}}; background: {{t.btn}}; color: {{t.btnText}}; box-shadow: 0 3px 0 {{t.shadow}}; display: flex; align-items: center; font-size: 15px; font-weight: 900; text-decoration: none">write</a>
      </div>
    </div>

    <section aria-label="November 2026" style="border-radius: 20px; border: 2px solid {{t.outline}}; background: {{t.surface}}; box-shadow: 0 5px 0 {{t.shadow}}; overflow: hidden">
      <div style="height: 46px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 8px; border-bottom: 2px solid {{t.outline}}; background-color: {{t.c1}}; background-image: repeating-conic-gradient({{t.c2}} 0 25%, transparent 0 50%); background-size: 12px 12px">
        <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 7px; border: 2px solid {{t.outline}}; background: {{t.surface}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" shape-rendering="crispEdges" aria-hidden="true"><path d="M3.5 2.5h2v1h1v1h1v-1h1v-1h2v1h1v3h-1v1h-1v1h-1v1h-1v1h-1v-1h-1v-1h-1v-1h-1v-1h-1v-3h1z" fill="{{t.c1}}" stroke="{{t.outline}}" stroke-width="1"></path></svg></span>
        <h2 style="margin: 0; padding: 1px 10px; border-radius: 999px; border: 2px solid {{t.outline}}; background: {{t.surface}}; font-family: 'Pixelify Sans', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.06em">NOVEMBER 2026</h2>
        <span style="flex: 1"></span>
        <button type="button" aria-label="Previous month" style="width: 36px; height: 36px; border-radius: 12px; border: 2px solid {{t.outline}}; background: {{t.surface}}; color: {{t.text}}; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5L4.5 7 9 11.5"></path></svg></button>
        <button type="button" aria-label="Next month" style="width: 36px; height: 36px; border-radius: 12px; border: 2px solid {{t.outline}}; background: {{t.surface}}; color: {{t.text}}; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2.5L9.5 7 5 11.5"></path></svg></button>
      </div>
      <div style="padding: 8px 12px 12px">
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-bottom: 4px">
          <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
            <span style="text-align: center; font-family: 'Pixelify Sans', sans-serif; font-size: 11px; font-weight: 500">{{w}}</span>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
            <sc-if value="{{c.blank}}" hint-placeholder-val="{{false}}"><span style="height: 40px" aria-hidden="true"></span></sc-if>
            <sc-if value="{{c.day}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-label="{{c.aria}}" aria-current="{{c.cur}}" style="height: 40px; box-sizing: border-box; border-radius: 12px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{t.text}}; box-shadow: {{c.sh}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0; font-family: {{c.font}}; font-size: {{c.fs}}px; font-weight: 800; cursor: pointer">
                <span style="line-height: 1.1">{{c.n}}</span>
                <sc-if value="{{c.star}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24"><path d="M12 1C12.9 7.6 16.4 11.1 23 12C16.4 12.9 12.9 16.4 12 23C11.1 16.4 7.6 12.9 1 12C7.6 11.1 11.1 7.6 12 1Z" fill="{{t.surface}}" stroke="{{t.outline}}" stroke-width="2.6"></path></svg></sc-if>
                <sc-if value="{{c.mood}}" hint-placeholder-val="{{false}}"><dc-import name="Sticker" kind="{{c.kind}}" size="22" hint-size="22px,22px"></dc-import></sc-if>
              </button>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </section>

    <section aria-label="Recent entries" style="border-radius: 20px; border: 2px solid {{t.outline}}; background: {{t.surface}}; box-shadow: 0 5px 0 {{t.shadow}}; overflow: hidden">
      <div style="height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 2px solid {{t.outline}}; background-color: {{t.c4}}; background-image: repeating-conic-gradient({{t.c5}} 0 25%, transparent 0 50%); background-size: 12px 12px">
        <span style="padding: 1px 10px; border-radius: 999px; border: 2px solid {{t.outline}}; background: {{t.surface}}; font-family: 'Pixelify Sans', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.06em">RECENT ENTRIES</span>
      </div>
      <sc-if value="{{hasEntries}}" hint-placeholder-val="{{true}}">
        <div style="padding: 8px; display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{entries}}" as="e" hint-placeholder-count="2">
            <a href="DiaryEntry.dc.html" style="min-height: 56px; box-sizing: border-box; padding: 0 12px 0 8px; border-radius: 15px; border: 2px solid {{t.outline}}; background: {{e.fill}}; color: {{t.text}}; display: flex; align-items: center; gap: 10px; text-decoration: none">
              <dc-import name="Sticker" kind="{{e.kind}}" size="38" hint-size="38px,38px"></dc-import>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                <span style="font-family: 'Pixelify Sans', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em">{{e.date}}</span>
                <span style="font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.line}}</span>
              </span>
              <svg width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 2.5L9.5 7 5 11.5"></path></svg>
            </a>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{noEntries}}" hint-placeholder-val="{{false}}">
        <div style="height: 126px; box-sizing: border-box; padding: 12px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center">
          <dc-import name="Sticker" kind="chill" size="40" hint-size="40px,40px"></dc-import>
          <span style="font-size: 15px; font-weight: 900">no entries yet. one line is plenty</span>
          <span style="font-size: 13px; font-weight: 700">or just pick a mood, that counts too ♡</span>
        </div>
      </sc-if>
    </section>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: {{W}}px; height: 96px">
    <dc-import name="Taskbar" palette="{{palette}}" active="diary" w="{{W}}" hint-size="390px,96px"></dc-import>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["cloud","lilac","peachfuzz","peachsoda","orchid","midnight"],"default":"cloud","section":"Theme"},"state":{"editor":"enum","options":["empty","partial"],"default":"partial","section":"State"},"$preview":{"width":390,"height":844}}'>
var PAL={cloud:{g:["#F6CDEB","#C6EFDD"],c:["#FDD2EE","#E1D5FD","#FDEFC0","#B4F2DD","#ADD9FE"],s:"#FFFFFF",o:"#4A72A8",t:"#2E2F73",b:"#4A72A8",bt:"#FFFFFF"},lilac:{g:["#E1CBF2","#B9E6EC"],c:["#FAD6EE","#DBCEF8","#CBC3F6","#88C8F6","#DBCEF8"],s:"#FFFFFF",o:"#5F52B8",t:"#3A2A66",b:"#6F60C8",bt:"#FFFFFF"},peachfuzz:{g:["#B8B8FF","#FFD8BE"],c:["#FFD8BE","#B8B8FF","#FFEEDD","#FFD8BE","#B8B8FF"],s:"#F8F7FF",o:"#5F4FD6",t:"#3A2A66",b:"#6F5CE8",bt:"#FFFFFF"},peachsoda:{g:["#F9D2CC","#FAC7C3"],c:["#FAC7C3","#E4D6F2","#FFEEDD","#E4D6F2","#FAC7C3"],s:"#FFF6F2",o:"#835AA5",t:"#4B2A7B",b:"#835AA5",bt:"#FFFFFF"},orchid:{g:["#FFEAFC","#BEDA62"],c:["#FFEAFC","#9D96FF","#FAC75A","#BEDA62","#9D96FF"],s:"#FFFFFF",o:"#8E1E78",t:"#5B1E58",b:"#C936AE",bt:"#FFFFFF"},midnight:{g:["#1C1838","#2A2350"],c:["#332B60","#3F3574","#332B60","#3F3574","#332B60"],s:"#2A2350",o:"#B8B8FF",t:"#F8F7FF",b:"#FFD8BE",bt:"#1C1838"}};
function tok(k){var p=PAL[k]||PAL.cloud;return {bg1:p.g[0],bg2:p.g[1],c1:p.c[0],c2:p.c[1],c3:p.c[2],c4:p.c[3],c5:p.c[4],surface:p.s,outline:p.o,text:p.t,btn:p.b,btnText:p.bt,grid:p.o+"1F",shadow:p.o+"4D",ring:p.o+"59",scrim:p.g[0]+"B3",soft:p.t+"BF",clear:p.s+"00"};}
function cloud(w,h){var T=18,r=22,W=w-1,H=h-1;return "M"+(r+1)+" "+T+" L28 "+T+" A16 16 0 0 1 60 "+T+" L64 "+T+" A11 11 0 0 1 86 "+T+" L"+(W-r)+" "+T+" A"+r+" "+r+" 0 0 1 "+W+" "+(T+r)+" L"+W+" "+(H-r)+" A"+r+" "+r+" 0 0 1 "+(W-r)+" "+H+" L"+(r+1)+" "+H+" A"+r+" "+r+" 0 0 1 1 "+(H-r)+" L1 "+(T+r)+" A"+r+" "+r+" 0 0 1 "+(r+1)+" "+T+" Z";}
class Component extends DCLogic {
  renderVals() {
    var palette = this.props.palette ?? "cloud";
    var W = Number(this.props.w ?? 390);
    var empty = (this.props.state ?? "partial") === "empty";
    var t = tok(palette);
    var moods = empty ? {} : { 2: "proud", 3: "chill", 5: "tempted" };
    var starDays = empty ? {} : { 1: true, 6: true };
    var cells = [];
    for (var b = 0; b < 6; b++) cells.push({ blank: true, day: false });
    for (var d = 1; d <= 30; d++) {
      var today = d === 6, mood = moods[d], star = !!starDays[d] && !mood;
      cells.push({
        blank: false, day: true, n: String(d),
        mood: !!mood, kind: mood || "cloud", star: star,
        bg: today ? t.surface : (star ? t.c3 : "transparent"),
        border: today ? t.btn : "transparent",
        sh: today ? "0 3px 0 " + t.shadow : "none",
        cur: today ? "date" : "false",
        font: mood ? "'Pixelify Sans', sans-serif" : "Nunito, sans-serif",
        fs: mood ? 10 : (star ? 12 : 13),
        aria: "November " + d + (today ? ", today" : "") + (mood ? ", mood " + mood : "") + (star ? ", star" : "")
      });
    }
    while (cells.length < 42) cells.push({ blank: true, day: false });
    return {
      t: t, palette: palette,
      stars: empty ? "0" : "4",
      W: W, H: Number(this.props.h ?? 844), cw: W - 32,
      promptPath: cloud(W - 32, 86),
      weekdays: ["M", "T", "W", "T", "F", "S", "S"],
      cells: cells,
      hasEntries: !empty, noEntries: empty,
      entries: [
        { date: "NOV 5", line: "saw the cutest bag. said nvm. kinda proud?", kind: "tempted", fill: t.c2 },
        { date: "NOV 3", line: "slow day, cooked at home, felt rich lol", kind: "chill", fill: t.c4 }
      ]
    };
  }
}
</script>
</body>
</html>
