<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recap card, week, loved</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1080px; height: 1920px">
  <dc-import name="RecapCard" period="week" kind="loved" size="big" palette="{{palette}}" hint-size="1080px,1920px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["cloud","lilac","peachfuzz","peachsoda","orchid","midnight"],"default":"cloud","section":"Theme"},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    return { palette: this.props.palette ?? "cloud" };
  }
}
</script>
</body>
</html>
