<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="width: {{W}}px; height: {{H}}px; position: relative; overflow: hidden; box-sizing: border-box; font-family: Nunito, sans-serif; color: {{t.text}}; background-image: linear-gradient({{t.grid}} 1px, transparent 1px), linear-gradient(90deg, {{t.grid}} 1px, transparent 1px), linear-gradient(180deg, {{t.bg1}}, {{t.bg2}}); background-size: 22px 22px, 22px 22px, 100% 100%">
  <header style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; align-items: center; gap: 10px">
    <a href="LovedList.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; box-sizing: border-box; border-radius: 16px; border: 2px solid {{t.outline}}; background: {{t.surface}}; color: {{t.text}}; box-shadow: 0 3px 0 {{t.shadow}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5L4.5 7 9 11.5"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font-family: Pacifico, cursive; font-weight: 400; font-size: 30px; line-height: 1.3">Recap</h1>
    <span style="padding: 2px 10px; border-radius: 999px; border: 2px solid {{t.outline}}; background: {{t.surface}}; font-family: 'Pixelify Sans', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em">{{dateLabel}}</span>
  </header>

  <div style="position: absolute; left: 16px; right: 16px; top: 112px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; padding: 3px; gap: 3px; border-radius: 24px; border: 2px solid {{t.outline}}; background: {{t.surface}}">
      <sc-for list="{{periods}}" as="p" hint-placeholder-count="2">
        <button type="button" aria-pressed="{{p.on}}" style="flex: 1; height: 38px; border-radius: 19px; border: 2px solid {{p.border}}; background: {{p.bg}}; color: {{t.text}}; font-family: Nunito, sans-serif; font-size: 14px; font-weight: {{p.w}}; cursor: pointer">{{p.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; padding: 3px; gap: 3px; border-radius: 24px; border: 2px solid {{t.outline}}; background: {{t.surface}}">
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
        <button type="button" aria-pressed="{{k.on}}" style="flex: 1; height: 38px; border-radius: 19px; border: 2px solid {{k.border}}; background: {{k.bg}}; color: {{t.text}}; font-family: Nunito, sans-serif; font-size: 14px; font-weight: {{k.w}}; cursor: pointer">{{k.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: {{pv.l}}px; top: 172px; width: {{pv.w}}px; height: {{pv.h}}px; box-sizing: border-box; border-radius: 16px; border: 2px solid {{t.outline}}; box-shadow: 0 6px 0 {{t.shadow}}; overflow: hidden">
    <div style="width: 1080px; height: 1920px; transform: scale({{pv.s}}); transform-origin: 0 0">
      <dc-import name="RecapCard" period="{{period}}" kind="{{kind}}" size="{{size}}" palette="{{palette}}" hint-size="1080px,1920px"></dc-import>
    </div>
  </div>
  <span style="position: absolute; left: {{pv.bl}}px; top: {{pv.bt}}px; padding: 1px 6px; border-radius: 999px; border: 2px solid {{t.outline}}; background: {{t.surface}}; font-family: 'Pixelify Sans', sans-serif; font-size: 11px; font-weight: 500">9:16</span>

  <section aria-label="List" style="position: absolute; left: 16px; right: 16px; top: {{pv.lt}}px; border-radius: 18px; border: 2px solid {{t.outline}}; background: {{t.surface}}; box-shadow: 0 4px 0 {{t.shadow}}; overflow: hidden">
    <div style="height: 32px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 2px solid {{t.outline}}; background-color: {{t.c1}}; background-image: repeating-conic-gradient({{t.c2}} 0 25%, transparent 0 50%); background-size: 10px 10px">
      <span style="padding: 0 8px; border-radius: 999px; border: 2px solid {{t.outline}}; background: {{t.surface}}; font-family: 'Pixelify Sans', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.06em">{{listTitle}}</span>
      <span style="flex: 1"></span>
      <span style="padding: 0 8px; border-radius: 999px; border: 2px solid {{t.outline}}; background: {{t.c3}}; font-family: 'Pixelify Sans', sans-serif; font-size: 12px; font-weight: 600">{{totalChip}}</span>
    </div>
    <div style="padding: 6px 14px 8px; display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="height: 30px; display: flex; align-items: center; gap: 10px">
          <span style="width: 22px; font-family: 'Pixelify Sans', sans-serif; font-size: 13px; font-weight: 600">{{r.n}}</span>
          <span style="flex: 1; font-size: 15px; font-weight: 800">{{r.name}}</span>
          <span style="font-family: 'Pixelify Sans', sans-serif; font-size: 15px; font-weight: 600">{{r.right}}</span>
        </div>
      </sc-for>
      <span style="padding-left: 32px; font-size: 13px; font-weight: 800">{{moreLine}}</span>
    </div>
  </section>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; gap: 10px">
    <button type="button" style="flex: 1; height: 56px; border-radius: 28px; border: 2px solid {{t.outline}}; background: {{t.surface}}; color: {{t.text}}; box-shadow: 0 4px 0 {{t.shadow}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: Nunito, sans-serif; font-size: 16px; font-weight: 900; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2v7M4 6.5L7 9.5l3-3M2.5 12h9"></path></svg>save
    </button>
    <button type="button" style="flex: 1.3; height: 56px; border-radius: 28px; border: 2px solid {{t.outline}}; background: {{t.btn}}; color: {{t.btnText}}; box-shadow: 0 4px 0 {{t.shadow}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: Nunito, sans-serif; font-size: 17px; font-weight: 900; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V2M4 4.5L7 1.5l3 3M3 7v5h8V7"></path></svg>share
    </button>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["cloud","lilac","peachfuzz","peachsoda","orchid","midnight"],"default":"cloud","section":"Theme"},"state":{"editor":"enum","options":["month","loved","week","quiet"],"default":"month","section":"State"},"$preview":{"width":390,"height":844}}'>
var PAL={cloud:{g:["#F6CDEB","#C6EFDD"],c:["#FDD2EE","#E1D5FD","#FDEFC0","#B4F2DD","#ADD9FE"],s:"#FFFFFF",o:"#4A72A8",t:"#2E2F73",b:"#4A72A8",bt:"#FFFFFF"},lilac:{g:["#E1CBF2","#B9E6EC"],c:["#FAD6EE","#DBCEF8","#CBC3F6","#88C8F6","#DBCEF8"],s:"#FFFFFF",o:"#5F52B8",t:"#3A2A66",b:"#6F60C8",bt:"#FFFFFF"},peachfuzz:{g:["#B8B8FF","#FFD8BE"],c:["#FFD8BE","#B8B8FF","#FFEEDD","#FFD8BE","#B8B8FF"],s:"#F8F7FF",o:"#5F4FD6",t:"#3A2A66",b:"#6F5CE8",bt:"#FFFFFF"},peachsoda:{g:["#F9D2CC","#FAC7C3"],c:["#FAC7C3","#E4D6F2","#FFEEDD","#E4D6F2","#FAC7C3"],s:"#FFF6F2",o:"#835AA5",t:"#4B2A7B",b:"#835AA5",bt:"#FFFFFF"},orchid:{g:["#FFEAFC","#BEDA62"],c:["#FFEAFC","#9D96FF","#FAC75A","#BEDA62","#9D96FF"],s:"#FFFFFF",o:"#8E1E78",t:"#5B1E58",b:"#C936AE",bt:"#FFFFFF"},midnight:{g:["#1C1838","#2A2350"],c:["#332B60","#3F3574","#332B60","#3F3574","#332B60"],s:"#2A2350",o:"#B8B8FF",t:"#F8F7FF",b:"#FFD8BE",bt:"#1C1838"}};
function tok(k){var p=PAL[k]||PAL.cloud;return {bg1:p.g[0],bg2:p.g[1],c1:p.c[0],c2:p.c[1],c3:p.c[2],c4:p.c[3],c5:p.c[4],surface:p.s,outline:p.o,text:p.t,btn:p.b,btnText:p.bt,grid:p.o+"1F",shadow:p.o+"4D",ring:p.o+"59",scrim:p.g[0]+"B3",soft:p.t+"BF",clear:p.s+"00"};}
var DATA = {
  month: { rows: [["mini bag", "$64"], ["concert merch", "$45"], ["phone case", "$32"]], more: "+ 11 more", title: "TRACK LIST · 14", total: "$474.50 KEPT" },
  loved: { rows: [["lavender cardigan", "nov 2"], ["concert w/ my girls", "nov 4"], ["cherry lip gloss", "nov 5"]], more: "+ 3 more", title: "TRACK LIST · 6", total: "6 LOVED" },
  week: { rows: [["mini bag", "$64"], ["phone case", "$32"], ["platform sneakers", "$24"]], more: "+ 1 more", title: "THIS WEEK · 4", total: "$126.50 KEPT" },
  quiet: { rows: [["phone case", "$24"], ["bubble tea", "$6.50"]], more: "that’s the whole tracklist. still a hit ♡", title: "TRACK LIST · 2", total: "$30.50 KEPT" }
};
class Component extends DCLogic {
  renderVals() {
    var palette = this.props.palette ?? "cloud";
    var W = Number(this.props.w ?? 390), H = Number(this.props.h ?? 844), compact = H < 740;
    var ph = compact ? 259 : 384, pw = Math.round(ph * 9 / 16);
    var pv = { h: ph, w: pw, s: ((pw - 4) / 1080).toFixed(4), l: Math.round((W - pw) / 2), bl: Math.round((W + pw) / 2) + 7, bt: 172 + ph - 36, lt: compact ? 443 : 572 };
    var s = this.props.state ?? "month";
    var t = tok(palette);
    var d = DATA[s] || DATA.month;
    var period = s === "week" ? "week" : "month";
    var kind = s === "loved" ? "loved" : "wanted";
    var seg = function (label, on) { return { label: label, on: on, bg: on ? t.c3 : "transparent", border: on ? t.outline : "transparent", w: on ? 900 : 800 }; };
    return {
      t: t, palette: palette, W: W, H: H, pv: pv,
      period: period, kind: kind, size: s === "quiet" ? "quiet" : "big",
      dateLabel: period === "week" ? "WEEK OF NOV 2" : "NOVEMBER",
      periods: [seg("week", period === "week"), seg("month", period === "month")],
      kinds: [seg("wanted", kind === "wanted"), seg("loved", kind === "loved")],
      rows: d.rows.slice(0, compact ? 2 : 3).map(function (r, i) { return { n: "0" + (i + 1), name: r[0], right: r[1] }; }),
      moreLine: d.more, listTitle: d.title, totalChip: d.total
    };
  }
}
</script>
</body>
</html>
