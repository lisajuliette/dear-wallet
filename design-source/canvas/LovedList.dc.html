<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loved list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="width: {{W}}px; height: {{H}}px; position: relative; overflow: hidden; box-sizing: border-box; font-family: Nunito, sans-serif; color: {{t.text}}; background-image: linear-gradient({{t.grid}} 1px, transparent 1px), linear-gradient(90deg, {{t.grid}} 1px, transparent 1px), linear-gradient(180deg, {{t.bg1}}, {{t.bg2}}); background-size: 22px 22px, 22px 22px, 100% 100%">
  <header style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; align-items: center; gap: 10px">
    <a href="Tally.dc.html" aria-label="Back to tally" style="width: 44px; height: 44px; flex: none; box-sizing: border-box; border-radius: 16px; border: 2px solid {{t.outline}}; background: {{t.surface}}; color: {{t.text}}; box-shadow: 0 3px 0 {{t.shadow}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5L4.5 7 9 11.5"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font-family: Pacifico, cursive; font-weight: 400; font-size: 30px; line-height: 1.3">Loved</h1>
    <button type="button" aria-label="Add a loved thing" style="height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: 2px solid {{t.outline}}; background: {{t.btn}}; color: {{t.btnText}}; box-shadow: 0 3px 0 {{t.shadow}}; display: flex; align-items: center; gap: 6px; font-family: Nunito, sans-serif; font-size: 15px; font-weight: 900; cursor: pointer"><svg width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M7 2.5v9M2.5 7h9"></path></svg>add</button>
  </header>

  <div style="position: absolute; left: 16px; right: 16px; top: 112px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 2px solid {{t.outline}}; background: {{t.surface}}; display: flex; align-items: center; padding: 0 4px">
    <button type="button" aria-label="Previous month" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: transparent; color: {{t.text}}; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5L4.5 7 9 11.5"></path></svg></button>
    <span style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px">
      <span style="font-family: 'Pixelify Sans', sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 0.06em">NOVEMBER</span>
      <span style="padding: 0 8px; border-radius: 999px; background: {{t.c1}}; font-size: 12px; font-weight: 900">{{countLabel}}</span>
    </span>
    <button type="button" aria-label="Next month" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: transparent; color: {{t.text}}; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2.5L9.5 7 5 11.5"></path></svg></button>
  </div>

  <sc-if value="{{filled}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 16px; right: 16px; top: 168px; bottom: 104px; overflow-y: auto; align-content: start; padding-bottom: 8px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <button type="button" aria-label="{{it.aria}}" style="height: 180px; box-sizing: border-box; border-radius: 20px; border: 2px solid {{t.outline}}; background: {{t.surface}}; box-shadow: 0 4px 0 {{t.shadow}}; color: {{t.text}}; padding: 0; overflow: hidden; display: flex; flex-direction: column; text-align: left; font-family: Nunito, sans-serif; cursor: pointer">
          <span style="height: 108px; flex: none; position: relative; border-bottom: 2px solid {{t.outline}}; background: {{it.photoBg}}; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{it.hasPhoto}}" hint-placeholder-val="{{true}}">
              <svg width="30" height="30" viewBox="0 0 14 14" shape-rendering="crispEdges" fill="none" stroke="{{t.outline}}" stroke-width="1" stroke-linecap="square" aria-hidden="true"><path d="M1.5 4.5h3v-1h1v-1h3v1h1v1h3v7h-11z" fill="{{t.surface}}"></path><path d="M5.5 6.5h3v3h-3z" fill="{{it.fill}}"></path></svg>
              <span style="position: absolute; left: 8px; bottom: 6px; padding: 0 6px; border-radius: 999px; background: {{t.surface}}; font-size: 10px; font-weight: 800">photo</span>
            </sc-if>
            <sc-if value="{{it.noPhoto}}" hint-placeholder-val="{{false}}">
              <dc-import name="Sticker" kind="{{it.sticker}}" size="72" hint-size="72px,72px"></dc-import>
            </sc-if>
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 14 14" shape-rendering="crispEdges" style="position: absolute; right: 8px; top: 8px"><path d="M3.5 2.5h2v1h1v1h1v-1h1v-1h2v1h1v3h-1v1h-1v1h-1v1h-1v1h-1v-1h-1v-1h-1v-1h-1v-1h-1v-3h1z" fill="{{t.c1}}" stroke="{{t.outline}}" stroke-width="1"></path></svg>
          </span>
          <span style="flex: 1; padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; gap: 1px; background: {{it.fill}}">
            <span style="font-size: 15px; font-weight: 900; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800">{{it.date}}<sc-if value="{{it.hasPrice}}" hint-placeholder-val="{{false}}"><span style="font-family: 'Pixelify Sans', sans-serif; font-size: 13px; font-weight: 600">· {{it.price}}</span></sc-if></span>
          </span>
        </button>
      </sc-for>
    </div>
    <div style="position: absolute; left: 16px; right: 16px; bottom: 34px">
      <a href="Recap_Loved.dc.html" style="width: 100%; height: 56px; box-sizing: border-box; border-radius: 28px; border: 2px solid {{t.outline}}; background: {{t.c3}}; color: {{t.text}}; box-shadow: 0 4px 0 {{t.shadow}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 900; text-decoration: none">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M12 1C12.9 7.6 16.4 11.1 23 12C16.4 12.9 12.9 16.4 12 23C11.1 16.4 7.6 12.9 1 12C7.6 11.1 11.1 7.6 12 1Z" fill="{{t.surface}}" stroke="{{t.outline}}" stroke-width="2"></path></svg>make my november recap
      </a>
    </div>
  </sc-if>

  <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
    <section aria-label="Loved list is empty" style="position: absolute; left: 16px; right: 16px; top: 190px; border-radius: 24px; border: 2px solid {{t.outline}}; background: {{t.surface}}; box-shadow: 0 5px 0 {{t.shadow}}; overflow: hidden">
      <div style="height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 2px solid {{t.outline}}; background-color: {{t.c1}}; background-image: repeating-conic-gradient({{t.c2}} 0 25%, transparent 0 50%); background-size: 12px 12px">
        <span style="padding: 1px 10px; border-radius: 999px; border: 2px solid {{t.outline}}; background: {{t.surface}}; font-family: 'Pixelify Sans', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.06em">LOVED.EXE</span>
      </div>
      <div style="padding: 28px 24px 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <dc-import name="Sticker" kind="heart" size="96" hint-size="96px,96px"></dc-import>
        <h2 style="margin: 6px 0 0; font-size: 20px; font-weight: 900">nothing loved yet this month</h2>
        <p style="margin: 0; font-size: 14px; font-weight: 700; line-height: 1.45">add the things u bought and adored. a song, a place or a night out counts too. photo optional, no price needed.</p>
        <button type="button" style="margin-top: 8px; height: 52px; padding: 0 24px; border-radius: 26px; border: 2px solid {{t.outline}}; background: {{t.btn}}; color: {{t.btnText}}; box-shadow: 0 4px 0 {{t.shadow}}; font-family: Nunito, sans-serif; font-size: 16px; font-weight: 900; cursor: pointer">+ add a loved thing</button>
      </div>
    </section>
    <p style="position: absolute; left: 32px; right: 32px; top: 620px; margin: 0; font-size: 13px; font-weight: 800; text-align: center">loved things stay separate from ur tally, so they never change ur kept total ♡</p>
  </sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["cloud","lilac","peachfuzz","peachsoda","orchid","midnight"],"default":"cloud","section":"Theme"},"state":{"editor":"enum","options":["empty","filled"],"default":"filled","section":"State"},"$preview":{"width":390,"height":844}}'>
var PAL={cloud:{g:["#F6CDEB","#C6EFDD"],c:["#FDD2EE","#E1D5FD","#FDEFC0","#B4F2DD","#ADD9FE"],s:"#FFFFFF",o:"#4A72A8",t:"#2E2F73",b:"#4A72A8",bt:"#FFFFFF"},lilac:{g:["#E1CBF2","#B9E6EC"],c:["#FAD6EE","#DBCEF8","#CBC3F6","#88C8F6","#DBCEF8"],s:"#FFFFFF",o:"#5F52B8",t:"#3A2A66",b:"#6F60C8",bt:"#FFFFFF"},peachfuzz:{g:["#B8B8FF","#FFD8BE"],c:["#FFD8BE","#B8B8FF","#FFEEDD","#FFD8BE","#B8B8FF"],s:"#F8F7FF",o:"#5F4FD6",t:"#3A2A66",b:"#6F5CE8",bt:"#FFFFFF"},peachsoda:{g:["#F9D2CC","#FAC7C3"],c:["#FAC7C3","#E4D6F2","#FFEEDD","#E4D6F2","#FAC7C3"],s:"#FFF6F2",o:"#835AA5",t:"#4B2A7B",b:"#835AA5",bt:"#FFFFFF"},orchid:{g:["#FFEAFC","#BEDA62"],c:["#FFEAFC","#9D96FF","#FAC75A","#BEDA62","#9D96FF"],s:"#FFFFFF",o:"#8E1E78",t:"#5B1E58",b:"#C936AE",bt:"#FFFFFF"},midnight:{g:["#1C1838","#2A2350"],c:["#332B60","#3F3574","#332B60","#3F3574","#332B60"],s:"#2A2350",o:"#B8B8FF",t:"#F8F7FF",b:"#FFD8BE",bt:"#1C1838"}};
function tok(k){var p=PAL[k]||PAL.cloud;return {bg1:p.g[0],bg2:p.g[1],c1:p.c[0],c2:p.c[1],c3:p.c[2],c4:p.c[3],c5:p.c[4],surface:p.s,outline:p.o,text:p.t,btn:p.b,btnText:p.bt,grid:p.o+"1F",shadow:p.o+"4D",ring:p.o+"59",scrim:p.g[0]+"B3",soft:p.t+"BF",clear:p.s+"00"};}
class Component extends DCLogic {
  renderVals() {
    var empty = (this.props.state ?? "filled") === "empty";
    var t = tok(this.props.palette ?? "cloud");
    var cols = [t.c1, t.c2, t.c3, t.c4, t.c5, t.c2];
    var raw = [
      ["lavender cardigan", "nov 2", "$38", true, ""],
      ["concert w/ my girls", "nov 4", "", false, "phone"],
      ["cherry lip gloss", "nov 5", "$14", true, ""],
      ["sunday matcha run", "nov 6", "", false, "tea"],
      ["film roll", "nov 8", "$12", true, ""],
      ["new fave song", "nov 9", "", false, "bubble"]
    ];
    var items = raw.map(function (r, i) {
      return {
        name: r[0], date: r[1], price: r[2], hasPrice: !!r[2], hasPhoto: r[3], noPhoto: !r[3], sticker: r[4] || "heart",
        fill: cols[i], photoBg: r[3] ? "linear-gradient(135deg, " + cols[i] + ", " + t.c5 + ")" : t.surface,
        aria: r[0] + ", " + r[1] + (r[2] ? ", " + r[2] : "")
      };
    });
    return { W: Number(this.props.w ?? 390), H: Number(this.props.h ?? 844), t: t, filled: !empty, empty: empty, items: items, countLabel: empty ? "0 loved" : "6 loved" };
  }
}
</script>
</body>
</html>
